name: SAPS 3 calculation and security checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Pytest Suite
      run: |
        python -m compileall -q agents saps3_calc.py cli.py
        python -m pip check
        pytest -v

    - name: Audit signature validation smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('In-memory audit signature checks passed')
        "

    - name: Validate browser JavaScript syntax
      run: |
        python -c "import re; from pathlib import Path; html = Path('index.html').read_text(encoding='utf-8'); match = re.search(r'<script>(.*?)</script>', html, re.S); assert match, 'Missing embedded JavaScript'; Path('/tmp/saps3-browser.js').write_text(match.group(1))"
        node --check /tmp/saps3-browser.js
